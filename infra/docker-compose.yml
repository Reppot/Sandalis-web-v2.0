version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sandalis
      POSTGRES_PASSWORD: sandalis
      POSTGRES_DB: sandalis
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sandalis"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ../backend
      dockerfile: ../infra/Dockerfile.api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql+asyncpg://sandalis:sandalis@db:5432/sandalis"
      DEBUG: "true"
    ports:
      - "8000:8000"

  web:
    build:
      context: ../frontend
      dockerfile: ../infra/Dockerfile.web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: "http://api:8000"
    ports:
      - "3000:3000"

volumes:
  pgdata: