# Infra-as-code. Сайт — ОДИН web-сервис на Docker: Next.js (публичный порт) +
# FastAPI (127.0.0.1:8000) в одном контейнере, см. ../Dockerfile и ../deploy/start.sh.
# Браузер ходит только на домен сервиса, /api/v1/* проксирует Next — CORS не нужен,
# кука сессии first-party, один холодный старт вместо двух.
# БД — Supabase (внешняя), поэтому блока `databases:` нет.
#
# Миграции (alembic) и сиды справочников (python -m app.seed) выполняются при каждом
# старте контейнера — идемпотентно.
#
# Значения sync: false вносятся вручную в Render → Environment.

services:
  - type: web
    name: Sandalis-web-v2.0
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: ENV
        value: prod
      # Supabase session pooler (postgres.<ref>@aws-1-eu-west-1.pooler.supabase.com:5432)
      - key: DATABASE_URL
        sync: false
      - key: DB_USE_PGBOUNCER
        value: "false"
      # длинный случайный секрет (openssl rand -hex 32); смена = выход всех пользователей
      - key: JWT_SECRET
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      # тот же URL — в Discord Developer Portal → OAuth2 → Redirects
      - key: DISCORD_REDIRECT_URI
        value: https://sandalis-web-v2-0.onrender.com/api/v1/auth/discord/callback
      - key: FRONTEND_URL
        value: https://sandalis-web-v2-0.onrender.com
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: lax
      - key: SESSION_COOKIE_NAME
        value: sindaris_session
      # 7 суток: кука и JWT живут одинаково, чтобы не выкидывало каждые полчаса
      - key: SESSION_TTL_MINUTES
        value: "10080"
      - key: ACCESS_TOKEN_TTL_MIN
        value: "10080"
      - key: DEFAULT_CLAN_ID
        value: SANDALIS
      # owner — ТОЛЬКО на первый вход владельца, затем вернуть guest
      - key: DEFAULT_CLAN_ROLE
        value: guest
      - key: DEFAULT_LOCALE
        value: ru

# Worker (war_import / ffmpeg / S3) в v2.0 не перенесён — см. backend/README.md,
# раздел "Известные ограничения".
