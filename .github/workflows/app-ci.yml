name: app-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sandalis
          POSTGRES_PASSWORD: sandalis-ci-only
          POSTGRES_DB: sandalis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sandalis -d sandalis_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - name: Run backend tests against the dedicated CI database
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://sandalis:sandalis-ci-only@127.0.0.1:5432/sandalis_test
        run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
