[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sandalis-backend"
version = "2.0.0"
description = "Sandalis-Web v2.0 API — FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.34.0,<1.0",
    "sqlalchemy[asyncio]>=2.0.40,<3.0",
    "asyncpg>=0.30.0,<1.0",
    "alembic>=1.15.0,<2.0",
    "pydantic>=2.11.0,<3.0",
    "pydantic-settings>=2.9.0,<3.0",
    "python-multipart>=0.0.20",
    "httpx>=0.28.0,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.26.0",
    "httpx>=0.28.0",
    "ruff>=0.11.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]