[project]
name = "sandalis-backend"
version = "2.0.0"
description = "Sandalis Web v2.0 — multitenancy + RBAC + i18n backend (FastAPI/SQLAlchemy 2.0/asyncpg)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 100
