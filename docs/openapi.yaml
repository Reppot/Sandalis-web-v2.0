openapi: 3.1.0
info:
  title: Sandalis API
  version: '2.0'
  description: 'HTTP-контракт SINDARIS Terminal v2.0. Сгенерирован из FastAPI (`app.openapi()`);

    при изменении ручек перегенерируйте, а не правьте вручную.


    Браузер ходит на API через прокси фронтенда (тот же origin, кука сессии first-party).

    Файлы интерфейса (иконки, фоны, логотип) раздаются из backend/static по /api/v1/assets/*.

    '
paths:
  /api/v1/health/live:
    get:
      tags:
      - health
      summary: Liveness без БД (для Render health check)
      operationId: live_api_v1_health_live_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Live Api V1 Health Live Get
  /api/v1/health/ping:
    get:
      tags:
      - health
      summary: 'Keep-alive: минимальный SELECT 1 (cron-job.org каждые 10 минут)'
      operationId: ping_api_v1_health_ping_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingOut'
  /api/v1/content:
    get:
      tags:
      - content
      summary: 'Реестр контента интерфейса (публичный: нужен экрану входа до авторизации)'
      description: 'kind: media, external_tool, training_module, ticker_phrase, region, material, catalog_category,
        factory_category, refinery_group, guide_chapter. Без kind — всё, кроме guide_chapter (руководство
        запрашивается отдельно).'
      operationId: list_content_api_v1_content_get
      parameters:
      - name: kind
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
              pattern: ^[a-z_]{1,32}$
          - type: 'null'
          title: Kind
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContentRead'
                title: Response List Content Api V1 Content Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/content/{kind}/{key}:
    put:
      tags:
      - content
      summary: Создать/изменить запись контента (admin клана-владельца контента)
      description: Контент глобальный, поэтому править его может только admin+ клана CONTENT_ADMIN_CLAN_ID
        (по умолчанию DEFAULT_CLAN_ID).
      operationId: upsert_content_api_v1_content__kind___key__put
      security:
      - ClanJWT: []
      parameters:
      - name: kind
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-z_]{1,32}$
          title: Kind
      - name: key
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 64
          title: Key
      - name: X-Clan-Token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Clan-Token
      - name: Accept-Language
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Accept-Language
      - name: X-Locale
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Locale
      - name: sindaris_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Sindaris Session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentUpsert'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/me:
    get:
      tags:
      - auth
      summary: 'Кто я: user/clan/role/scopes/avatar'
      operationId: read_me_api_v1_auth_me_get
      security:
      - ClanJWT: []
      parameters:
      - name: X-Clan-Token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Clan-Token
      - name: sindaris_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Sindaris Session
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/me/locale:
    put:
      tags:
      - auth
      summary: Сменить язык интерфейса (ru/en/cs)
      operationId: update_locale_api_v1_auth_me_locale_put
      security:
      - ClanJWT: []
      parameters:
      - name: X-Clan-Token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Clan-Token
      - name: sindaris_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Sindaris Session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocaleUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/dev-token:
    post:
      tags:
      - auth
      summary: DEV/ADMIN-выдача JWT (ENV!=prod или X-Dev-Auth-Key == DEV_AUTH_SECRET)
      operationId: issue_dev_token_api_v1_auth_dev_token_post
      parameters:
      - name: X-Dev-Auth-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Dev-Auth-Key
      - name: Accept-Language
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Accept-Language
      - name: X-Locale
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Locale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevTokenRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/guest:
    post:
      tags:
      - auth
      summary: 'Гостевой доступ: инструменты и каталог, без данных какого-либо клана'
      operationId: guest_login_api_v1_auth_guest_post
      parameters:
      - name: Accept-Language
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Accept-Language
      - name: X-Locale
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Locale
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/invites/{code}/preview:
    get:
      tags:
      - auth
      summary: 'Публичное превью invite-ссылки: клан и роль (код = секрет)'
      operationId: preview_invite_api_v1_auth_invites__code__preview_get
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
          title: Code
      - name: Accept-Language
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Accept-Language
      - name: X-Locale
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Locale
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitePreview'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/clan-token:
    post:
      tags:
      - auth
      summary: Выпуск кланового API-токена (X-Clan-Token) для ботов
      operationId: create_clan_token_api_v1_auth_clan_token_post
      security:
      - ClanJWT: []
      parameters:
      - name: Accept-Language
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Accept-Language
      - name: X-Locale
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Locale
      - name: X-Clan-Token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Clan-Token
      - name: sindaris_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Sindaris Session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClanApiTokenCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClanApiTokenCreated'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/invites:
    get:
      tags:
      - auth
      summary: Пригласительные коды клана
      operationId: list_invites_api_v1_auth_invites_get
      security:
      - ClanJWT: []
      parameters:
      - name: include_revoked
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Include Revoked
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      - name: X-Clan-Token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Clan-Token
      - name: Accept-Language
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Accept-Language
      - name: X-Locale
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Locale
      - name: sindaris_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Sindaris Session
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_InviteCodeRead_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - auth
      summary: Создать пригласительный код
      operationId: create_invite_api_v1_auth_invites_post
      security:
      - ClanJWT: []
      parameters:
      - name: X-Clan-Token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Clan-Token
      - name: Accept-Language
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Accept-Language
      - name: X-Locale
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Locale
      - name: sindaris_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Sindaris Session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteCodeCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteCodeCreated'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/invites/{invite_id}:
    delete:
      tags:
      - auth
      summary: Отозвать пригласительный код
      operationId: revoke_invite_api_v1_auth_invites__invite_id__delete
      security:
      - ClanJWT: []
      parameters:
      - name: invite_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Invite Id
      - name: X-Clan-Token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Clan-Token
      - name: Accept-Language
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Accept-Language
      - name: X-Locale
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Locale
      - name: sindaris_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Sindaris Session
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/discord/login:
    get:
      tags:
      - auth
      summary: 'Начать Discord OAuth2: 302 на Discord c подписанным state'
      description: Без DISCORD_CLIENT_ID/DISCORD_CLIENT_SECRET отвечает 503 discord.disabled.
      operationId: discord_login_api_v1_auth_discord_login_get
      parameters:
      - name: clan_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Clan Id
      - name: return_to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 512
          - type: 'null'
          title: Return To
      - name: invite
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 24
          - type: 'null'
          title: Invite
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '302':
          description: Redirect to Discord authorize URL
        '503':
          description: Discord OAuth is not configured
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/discord/callback:
    get:
      tags:
      - auth
      summary: 'OAuth2 callback: state -> token -> profile -> JWT (cookie или Bearer)'
      description: По умолчанию ставит session-cookie и делает 302 на FRONTEND_URL (или безопасный return_to
        из state). `?response=json` возвращает TokenResponse.
      operationId: discord_callback_api_v1_auth_discord_callback_get
      parameters:
      - name: code
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 512
          - type: 'null'
          title: Code
      - name: state
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 4096
          - type: 'null'
          title: State
      - name: response
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 16
          - type: 'null'
          title: Response
      - name: error
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 128
          - type: 'null'
          title: Error
      - name: Accept-Language
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Accept-Language
      - name: X-Locale
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Locale
      responses:
        '200':
          description: response=json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '302':
          description: Cookie + redirect to FRONTEND_URL
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/discord/setup:
    get:
      tags:
      - auth
      summary: 'Незавершённый Discord-вход: серверы во владении и кланы пользователя'
      operationId: discord_setup_api_v1_auth_discord_setup_get
      parameters:
      - name: Accept-Language
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Accept-Language
      - name: X-Locale
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Locale
      - name: sindaris_discord_setup
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Sindaris Discord Setup
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscordSetupRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - auth
      summary: Выбрать сервер клана (станете owner) или существующий клан
      operationId: discord_setup_select_api_v1_auth_discord_setup_post
      parameters:
      - name: Accept-Language
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Accept-Language
      - name: X-Locale
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Locale
      - name: sindaris_discord_setup
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Sindaris Discord Setup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscordSetupSelect'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/logout:
    post:
      tags:
      - auth
      summary: 'Выйти: удалить session-cookie (stateless JWT просто перестаёт передаваться)'
      operationId: logout_api_v1_auth_logout_post
      responses:
        '204':
          description: Cookie removed
  /api/v1/orders:
    get:
      tags:
      - orders
      summary: Список заказов текущего клана
      operationId: list_orders_api_v1_orders_get
      security:
      - ClanJWT: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/OrderStatus'
          - type: 'null'
          title: Status
      - name: assignee_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Assignee Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      - name: X-Clan-Token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Clan-Token
      - name: Accept-Language
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Accept-Language
      - name: X-Locale
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Locale
      - name: sindaris_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Sindaris Session
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_OrderRead_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - orders
      summary: Создать заказ (нужны orders:write + stockpiles:read)
      operationId: create_order_api_v1_orders_post
      security:
      - ClanJWT: []
      parameters:
      - name: X-Clan-Token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Clan-Token
      - name: Accept-Language
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Accept-Language
      - name: X-Locale
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Locale
      - name: sindaris_session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Sindaris Session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCreated'
