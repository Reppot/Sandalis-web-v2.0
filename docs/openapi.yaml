openapi: "3.1.0"
info:
  title: Sandalis API
  version: "2.0.0"
  description: |
    Единственный источник правды по HTTP-контракту.
    Автогенерация FastAPI должна совпадать с этим файлом.

servers:
  - url: http://localhost:8000
    description: Local dev
  - url: https://sandalis-api.onrender.com
    description: Production

paths:
  /health:
    get:
      operationId: rootHealth
      summary: Быстрый healthcheck без БД
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /api/health:
    get:
      operationId: apiHealth
      summary: Healthcheck с проверкой PostgreSQL
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: sandalis-api

# Остальные пути добавляются по мере реализации роутеров (итерации 4-5).