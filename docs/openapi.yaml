components:
  schemas:
    CatalogItemRead:
      properties:
        id:
          type: string
          title: Id
        code:
          type: string
          title: Code
        name:
          type: string
          title: Name
        english_name:
          type: string
          title: English Name
        category:
          type: string
          title: Category
        icon_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Icon Url
        crate_size:
          type: integer
          title: Crate Size
        production_time:
          type: integer
          title: Production Time
        is_active:
          type: boolean
          title: Is Active
      type: object
      required:
      - id
      - code
      - name
      - english_name
      - category
      - icon_url
      - crate_size
      - production_time
      - is_active
      title: CatalogItemRead
      description: 'Плоская форма совместима со старым ItemResponse фронта

        (id/name/english_name/icon_url/production_time); id == code.

        clan_id в модели нет — в схеме не появится.'
    ClanApiTokenCreate:
      properties:
        label:
          type: string
          maxLength: 64
          minLength: 1
          title: Label
        role:
          $ref: '#/components/schemas/ClanRole'
          default: guest
        expires_in_hours:
          anyOf:
          - type: integer
            maximum: 8760.0
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Expires In Hours
      additionalProperties: false
      type: object
      required:
      - label
      title: ClanApiTokenCreate
    ClanApiTokenCreated:
      properties:
        id:
          type: string
          title: Id
        label:
